[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainstorm"
version = "0.1.0"
description = "Multi-persona brainstorm engine: shared-table relay speech with pluggable roles/schedulers/stop-conditions/consumers"
readme = "brainstorm/README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
brainstorm = "brainstorm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brainstorm*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
