[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agora"
version = "0.1.0"
description = "Semantics-free multi-agent relay engine: shared-table relay speech with declarative scenario config"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "weave-agent-sdk>=0.2.0",
]

[project.scripts]
agora = "agora.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agora*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
